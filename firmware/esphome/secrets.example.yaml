# =====================================================================
# ESPHome secrets 模板
#
# 复制本文件为 secrets.yaml 并填入真实值。secrets.yaml 已被 .gitignore
# 排除，永远不会进入版本库。
# =====================================================================

# Wi-Fi 凭据
wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# ESPHome API 加密密钥 (base64, 32 字节) 与 OTA 密码
# key 生成: python -c "import base64,os; print(base64.b64encode(os.urandom(32)).decode())"
randmron__api_key: "REPLACE_WITH_BASE64_44_CHAR_KEY=="

# OTA 密码: 任意强口令即可
randmron__ota_password: "your-ota-password"

# 设备热点 (AP 模式) 密码，至少 8 位
randmron_ap: "fallback-ap-password"
