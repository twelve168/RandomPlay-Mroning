# Board: ESP32-C3 Super Mini (Generic)
# Definition: definitions/boards/esp32-c3-supermini/manifest.yaml

esphome:
  name: randmron-curtain_machine
  friendly_name: RandMron窗帘机

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret randmron__ota_password
  actions:
    - action: rotate_temporary
      variables:
        angle: float
        duration: int
      then:
        - script.execute:
            id: rotate_and_return
            target_angle: angle
            duration_ms: duration

ota:
  - platform: esphome
    password: !secret randmron__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: RandomPlay-Mroning
    password: !secret RandomPlay-ap
captive_portal:

# ============================================
# SG90 舵机控制配置
# ============================================

# PWM 输出引脚配置 - 舵机连接到 GPIO7
output:
  - platform: ledc
    id: pwm_output
    pin: GPIO7   # 舵机信号线连接到 GPIO7
    frequency: 50Hz  # SG90 需要 50Hz PWM

# 定义 SG90 舵机组件
servo:
  - id: my_servo
    output: pwm_output
    min_level: 2.5%   # 对应 0 度 (0.5ms / 20ms)
    max_level: 12.5%  # 对应 180 度 (2.5ms / 20ms)
    idle_level: 7.5%  # 对应 90 度 (1.5ms / 20ms) - 默认中位
    transition_length: 300ms  # 旋转过渡时间

# 文本传感器显示当前状态
text_sensor:
  - platform: template
    name: 历史 (history)
    id: servo_status
    lambda: |-
      return {"当前舵机状态"};

# ✅ 三态选择器（日语 + 括号内英文）
select:
  - platform: template
    name: "三态控制 (mode)"
    id: servo_mode
    icon: "mdi:toggle-switch"
    options:
      - "閉める (Close)"
      - "止まって (Stop)"
      - "開ける (Open)"
    initial_option: "止まって (Stop)"
    optimistic: true
    set_action:
      then:
        - if:
            condition:
              lambda: 'return x == "閉める (Close)";'
            then:
              - servo.write:
                  id: my_servo
                  level: -100%
              - text_sensor.template.publish:
                  id: servo_status
                  state: "閉める - 0°"
        - if:
            condition:
              lambda: 'return x == "止まって (Stop)";'
            then:
              - servo.write:
                  id: my_servo
                  level: 0%
              - text_sensor.template.publish:
                  id: servo_status
                  state: "止まって - 90°"
        - if:
            condition:
              lambda: 'return x == "開ける (Open)";'
            then:
              - servo.write:
                  id: my_servo
                  level: 100%
              - text_sensor.template.publish:
                  id: servo_status
                  state: "開ける - 180°"

# 数值输入框组件
number:
  # 角度保持输入框
  - platform: template
    name: 持续角度 (keep)
    id: set_angle_hold
    min_value: 0
    max_value: 180
    step: 1
    unit_of_measurement: "°"
    mode: box
    optimistic: true
    set_action:
      then:
        - servo.write:
            id: my_servo
            level: !lambda |-
              return ((x / 180.0) * 200.0 - 100.0);
        - text_sensor.template.publish:
            id: servo_status
            state: !lambda |-
              char buf[32];
              snprintf(buf, sizeof(buf), "保持 %.0f°", x);
              return std::string(buf);

  # 临时旋转角度
  - platform: template
    name: 即时控制-角度 (angle)
    id: temp_rotate_angle
    min_value: 0
    max_value: 180
    step: 1
    unit_of_measurement: "°"
    mode: box
    optimistic: true
    restore_value: true
  
  # 临时旋转时长
  - platform: template
    name: 即时控制-时长 (time)
    id: temp_rotate_duration
    min_value: 1
    max_value: 50000
    step: 500
    unit_of_measurement: "ms"
    mode: box
    optimistic: true
    restore_value: true

# 按钮组件
button:
  # 执行自定义临时旋转的按钮
  - platform: template
    name: 即时控制-执行 (swith)
    icon: "mdi:rotate-3d-variant"
    on_press:
      then:
        - script.execute:
            id: rotate_and_return
            target_angle: !lambda 'return id(temp_rotate_angle).state;'
            duration_ms: !lambda 'return (int)id(temp_rotate_duration).state;'
        - text_sensor.template.publish:
            id: servo_status
            state: !lambda |-
              char buf[64];
              snprintf(buf, sizeof(buf), "临时 %.0f° (%.0f ms)", 
                       id(temp_rotate_angle).state, 
                       id(temp_rotate_duration).state);
              return std::string(buf);

  # ✅ 新增：一键开门 8.5 秒
  - platform: template
    name: 打开窗帘 (oc-open)
    icon: "mdi:curtains"
    on_press:
      then:
        - script.execute:
            id: rotate_and_return
            target_angle: 180
            duration_ms: 10000
        - text_sensor.template.publish:
            id: servo_status
            state: "快速开门 - 180° (8500 ms)"

  # ✅ 新增：一键关门 8.5 秒
  - platform: template
    name: 关闭窗帘 (oc-close)
    icon: "mdi:curtains-closed"
    on_press:
      then:
        - script.execute:
            id: rotate_and_return
            target_angle: 0
            duration_ms: 10000
        - text_sensor.template.publish:
            id: servo_status
            state: "快速关门 - 0° (8500 ms)"

# 脚本 - 旋转到特定角度，持续特定时间后归中
script:
  - id: rotate_and_return
    mode: restart
    parameters:
      target_angle: float
      duration_ms: int
    then:
      - logger.log:
          format: "旋转到 %.1f 度，持续 %d ms"
          args: ['target_angle', 'duration_ms']
      
      - servo.write:
          id: my_servo
          level: !lambda |-
            return ((target_angle / 180.0) * 200.0 - 100.0);
      
      - text_sensor.template.publish:
          id: servo_status
          state: !lambda |-
            char buf[64];
            snprintf(buf, sizeof(buf), "临时 %.0f° (%d ms)", target_angle, duration_ms);
            return std::string(buf);
      
      - delay: !lambda |-
          return duration_ms;
      
      - logger.log: "归中到 90 度"
      - servo.write:
          id: my_servo
          level: 0%
      
      - text_sensor.template.publish:
          id: servo_status
          state: "已归中 - 90°"